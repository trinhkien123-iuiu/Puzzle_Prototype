<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mitoosis Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
  /* Chủ đề "phòng thí nghiệm kẹo dẻo": nền tím như nhìn qua kính hiển vi, tế bào là kẹo dẻo có mặt */
  :root { --bg1: #3a1350; --bg2: #1d0a2b; --text: #fff6fb; --muted: #dcbfe9; --accent: #ff7eb6; --gold: #ffc53d; --gold-dark: #b86b00; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; color: var(--text); font-family: 'Baloo 2', system-ui, 'Segoe UI', Roboto, sans-serif; overscroll-behavior: none; }
  body { display: flex; justify-content: center; background: radial-gradient(120% 80% at 50% 28%, #6c2a8a 0%, var(--bg1) 48%, var(--bg2) 100%) fixed; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 12% 18%, rgba(255,255,255,.08) 0 13px, transparent 14px),
      radial-gradient(circle at 86% 12%, rgba(255,255,255,.06) 0 22px, transparent 23px),
      radial-gradient(circle at 80% 72%, rgba(255,255,255,.05) 0 30px, transparent 31px),
      radial-gradient(circle at 18% 84%, rgba(255,255,255,.06) 0 18px, transparent 19px),
      radial-gradient(circle at 92% 44%, rgba(255,255,255,.05) 0 9px, transparent 10px),
      radial-gradient(circle at 6% 52%, rgba(255,255,255,.05) 0 7px, transparent 8px);
    animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translateY(-26px); } }
  .defs { position: absolute; width: 0; height: 0; }
  #app { position: relative; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 9px;
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }

  header { display: flex; align-items: center; gap: 8px; }
  header h1 { flex: 1; margin: 0; text-align: center; cursor: pointer; line-height: 1; }
  .logo { display: inline-block; font-size: 30px; font-weight: 800; letter-spacing: .05em; color: #ffe27a;
    text-shadow: 0 2px 0 #ff9f1c, 0 4px 0 #b8560a, 0 7px 10px rgba(0,0,0,.35); }
  header small { display: block; margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .nav, .iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--gold); color: #fff; font: inherit; font-size: 22px; font-weight: 800;
    background: radial-gradient(circle at 35% 30%, #a35ee8, #5a24a8 65%); box-shadow: 0 3px 0 var(--gold-dark); cursor: pointer; line-height: 1; padding: 0; }
  .nav:active, .iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-dark); }
  .nav:disabled { opacity: .3; cursor: default; }
  .iconbtn { width: 34px; height: 34px; font-size: 15px; border-width: 2px; }

  .hud { display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .hearts { font-size: 25px; letter-spacing: 2px; line-height: 1; }
  .hearts span { display: inline-block; color: #ff4d8d; text-shadow: 0 2px 0 #9e1846; }
  .hearts .empty { color: #563068; text-shadow: none; }
  .hearts .hit { animation: hit .7s ease-out; }
  .hearts .gain { animation: gain .8s ease-out; }
  @keyframes hit { 30% { transform: scale(1.7) rotate(-12deg); color: #fff; } }
  @keyframes gain { 0% { transform: scale(.2); } 50% { transform: scale(1.6); color: #ffe27a; } }
  #regen { flex: 1; text-align: right; }

  .goalbar { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 18px;
    background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.14); line-height: 1.25; }
  .goalbar span { flex: 1; }
  .goalbar b { font-size: 15.5px; }
  .goalbar small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .goalbar button { border: 0; border-radius: 14px; padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 800; color: #5a2a00; cursor: pointer;
    background: linear-gradient(#fff3a6, #ffc53d); box-shadow: 0 3px 0 var(--gold-dark); white-space: nowrap; }

  .stage { position: relative; }
  .stage::before { content: ''; position: absolute; inset: -4% -6%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255,210,236,.24), rgba(255,210,236,.07) 72%, transparent); }
  #board { position: relative; width: 100%; max-height: 48vh; display: block; touch-action: none; overflow: visible; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .stage.shake { animation: shake .4s; }
  @keyframes shake { 20% { transform: translate(-7px, 2px); } 40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
  .stage.flash::after { content: ''; position: absolute; inset: -10%; pointer-events: none; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,236,150,.75), transparent); animation: fade .7s forwards; }
  @keyframes fade { to { opacity: 0; } }

  /* Tế bào: .cell trượt, .body diễn một lần (mọc, co giãn, vỡ), .jelly thở liên tục */
  .cell { transition: transform .22s cubic-bezier(.3, .7, .4, 1); }
  .body, .jelly, .eyes, .spikes, .flag, .zz text, .bub { transform-box: fill-box; transform-origin: center; }
  .jelly { animation: breathe 2.8s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.04, .965); } }
  .eyes { animation: blink 5.3s infinite; }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .look { transition: transform .15s; }
  .cell.born .body { animation: born .45s cubic-bezier(.34, 1.7, .64, 1); }
  @keyframes born { from { transform: scale(.25); } }
  .cell.mutated .body { animation: morph .6s cubic-bezier(.34, 1.5, .64, 1); }
  @keyframes morph { from { transform: rotate(-220deg) scale(.3); } }
  .body.sq-x { animation: sqx .3s ease-out; }
  .body.sq-y { animation: sqy .3s ease-out; }
  @keyframes sqx { 35% { transform: scale(1.24, .8); } }
  @keyframes sqy { 35% { transform: scale(.8, 1.24); } }
  .cell.pop .body { animation: burst .3s ease-in forwards; }
  @keyframes burst { 35% { transform: scale(1.32); opacity: 1; } to { transform: scale(.1); opacity: 0; } }
  .cell.nope .body { animation: nope .32s; }
  @keyframes nope { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  .cell.waking .body { animation: wakeup .6s ease-out; }
  @keyframes wakeup { 35% { transform: translateY(-12px) scale(1.14); } }
  .cell.asleep .body { filter: saturate(.5) brightness(.93); }
  .zz { display: none; }
  .cell.asleep .zz { display: inline; }
  .zz text { animation: zfloat 2.4s ease-in-out infinite; }
  .zz text + text { animation-delay: -1.2s; }
  @keyframes zfloat { 0% { transform: translate(0, 6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(9px, -14px); opacity: 0; } }
  .spikes { animation: spin 9s linear infinite; }
  .flag { animation: wiggle .5s ease-in-out infinite alternate; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes wiggle { from { transform: rotate(-10deg); } to { transform: rotate(12deg); } }
  #layer.happy .jelly { animation: hop .45s ease-in-out 3; }
  @keyframes hop { 50% { transform: translateY(-14px) scale(1.06, .94); } }
  #layer.sad .jelly { animation: none; transform: translateY(5px) scale(1.05, .9); }
  #layer.sad .eyes { animation: none; transform: scaleY(.55); }

  .bub { animation: rise 2.2s ease-in infinite; }
  @keyframes rise { 0% { transform: translateY(8px) scale(.5); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateY(-24px) scale(1); opacity: 0; } }
  .ring { fill-opacity: .2; stroke-width: 5; stroke-dasharray: 16 10; stroke-linecap: round; animation: spin 14s linear infinite; transition: stroke-width .2s; }
  .ring.ok { stroke-dasharray: none; stroke-width: 7; fill-opacity: .35; animation: none; }
  .chev { animation: nudge 1.1s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(5px); opacity: .55; } }
  .mark { fill: none; stroke: #fff; stroke-width: 4; stroke-dasharray: 9 7; animation: pulse .75s ease-in-out infinite alternate; }
  .mark.sel { stroke: var(--gold); stroke-dasharray: none; stroke-width: 6; animation: none; }
  @keyframes pulse { from { opacity: .3; } }
  .pick { cursor: pointer; }

  .species { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .species span { display: flex; align-items: center; gap: 3px; padding: 1px 12px 1px 3px; border-radius: 99px; background: rgba(255,255,255,.1); transition: opacity .2s; }
  .species svg { width: 28px; height: 28px; }
  .species .low { color: #ffe27a; box-shadow: 0 0 0 2px #ffe27a inset; }
  .species .gone { opacity: .35; text-decoration: line-through; }
  .species .enemy { background: rgba(0,0,0,.2); color: var(--muted); }
  .toast { min-height: 21px; text-align: center; font-size: 14px; font-weight: 700; color: #ffd6ea; }

  /* Booster tròn kiểu viên kẹo, số lượng ở góc dưới */
  .boosters { display: flex; justify-content: center; gap: 24px; }
  .bst { position: relative; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text); font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
  .orb { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; font-size: 31px; line-height: 1;
    background: radial-gradient(circle at 35% 28%, #a465ee, #5a24a8 60%, #3c1474); border: 4px solid var(--gold);
    box-shadow: 0 4px 0 var(--gold-dark), 0 8px 14px rgba(0,0,0,.35), inset 0 -7px 10px rgba(0,0,0,.28), inset 0 5px 8px rgba(255,255,255,.28);
    transition: transform .12s; }
  .orb span { filter: drop-shadow(0 2px 0 rgba(0,0,0,.3)); }
  .bst:active .orb { transform: translateY(3px); }
  .badge { position: absolute; top: 44px; left: 47px; min-width: 25px; height: 25px; padding: 0 5px; border-radius: 13px; display: grid; place-items: center;
    background: #2b0f3a; border: 2px solid #fff; color: #fff; font-size: 13px; font-weight: 800; }
  .badge.plus { background: #2fc34e; }
  .bst.on .orb { border-color: #fff; animation: glow .8s ease-in-out infinite alternate; }
  @keyframes glow { to { box-shadow: 0 4px 0 var(--gold-dark), 0 0 24px 9px rgba(255,215,106,.8), inset 0 5px 8px rgba(255,255,255,.28); } }
  .bst.fire .orb { animation: fire .5s ease-out; }
  @keyframes fire { 30% { transform: scale(1.2) rotate(-10deg); } 65% { transform: scale(.94) rotate(5deg); } }
  .bst:disabled { cursor: default; }
  .bst:disabled .orb { filter: grayscale(.85) brightness(.75); }
  .bst:disabled > span:last-child { opacity: .5; }

  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .actions button { height: 46px; border: 0; border-radius: 23px; font: inherit; font-size: 15px; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(#ff92c6, #ef5499); box-shadow: 0 4px 0 #a52a66, 0 6px 12px rgba(0,0,0,.25); text-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .actions #hint { background: linear-gradient(#86dcff, #38a3e6); box-shadow: 0 4px 0 #1d6ea3, 0 6px 12px rgba(0,0,0,.25); }
  .actions button:active { transform: translateY(3px); box-shadow: 0 1px 0 #a52a66; }
  .actions button:disabled { filter: grayscale(.75); opacity: .45; cursor: default; transform: none; }
  .credit { margin: 2px 0 0; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .debug { align-self: center; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }

  .banner { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; justify-content: center; transform: translateY(120%);
    transition: transform .35s cubic-bezier(.34, 1.4, .64, 1); pointer-events: none; }
  .banner.show { transform: none; pointer-events: auto; }
  .banner .bar { width: 100%; max-width: 480px; margin: 0 16px calc(16px + env(safe-area-inset-bottom)); padding: 12px 14px 12px 18px; border-radius: 22px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 17px; font-weight: 800;
    background: linear-gradient(#fff3a6, #ffc53d); color: #5a2a00; border: 3px solid #fff; box-shadow: 0 6px 0 var(--gold-dark), 0 12px 28px rgba(0,0,0,.45); }
  .banner button { border: 0; border-radius: 14px; padding: 10px 16px; font: inherit; font-size: 15px; font-weight: 800; color: #fff; cursor: pointer; white-space: nowrap;
    background: linear-gradient(#ff92c6, #ef5499); box-shadow: 0 3px 0 #a52a66; }
  .banner button:disabled { opacity: .45; cursor: default; }
  #lost .bar { flex-direction: column; align-items: stretch; font-size: 15px; background: linear-gradient(#5f4b82, #3b2d57); color: var(--text);
    border-color: #9c8cc4; box-shadow: 0 6px 0 #22163a, 0 12px 28px rgba(0,0,0,.45); }
  #lost .bar div { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #lost #lostRevive { background: linear-gradient(#fff3a6, #ffc53d); color: #5a2a00; box-shadow: 0 3px 0 var(--gold-dark); }

  .modal { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(20, 5, 30, .82); }
  .modal.show { display: flex; }
  .card { width: 100%; max-width: 360px; max-height: 100%; overflow: auto; padding: 20px 18px; border-radius: 24px;
    background: linear-gradient(#5d257d, #3c1457); border: 3px solid rgba(255,255,255,.2); box-shadow: 0 14px 40px rgba(0,0,0,.55); }
  .modal.show .card { animation: popin .4s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes popin { from { transform: scale(.7); opacity: 0; } }
  .card h2 { margin: 8px 0; font-size: 23px; line-height: 1.2; }
  .card .primary { width: 100%; height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 16px; font-weight: 800; color: #5a2a00; cursor: pointer;
    background: linear-gradient(#fff3a6, #ffc53d); box-shadow: 0 4px 0 var(--gold-dark); }
  .card .primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #nohearts .card { max-width: 320px; text-align: center; }
  #nohearts .big { font-size: 48px; }
  #nohearts p { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
  #learn { z-index: 7; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase; }
  .tag.plain { background: rgba(255,255,255,.16); }
  .demo { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px 0 2px; }
  .demo svg { width: 42%; height: auto; max-height: 130px; overflow: visible; }
  .demo b { font-size: 24px; color: var(--gold); }
  .demo-cap { margin: 0 0 6px; text-align: center; font-size: 13px; font-weight: 600; color: var(--muted); }
  #learnPoints { margin: 10px 0 16px; padding-left: 20px; font-size: 15px; line-height: 1.45; }
  #learnPoints li + li { margin-top: 5px; }
  .learnhead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }

  /* Bảng thắng: sao bay vào, số lần vuốt, về bản đồ hoặc chơi tiếp */
  #solved .bar { flex-direction: column; align-items: stretch; gap: 4px; text-align: center; }
  .winstars { font-size: 42px; line-height: 1; letter-spacing: 6px; }
  .winstars span { display: inline-block; color: rgba(90, 42, 0, .22); }
  .winstars span.on { color: #ff8a1f; text-shadow: 0 3px 0 #fff, 0 0 12px rgba(255,255,255,.8); animation: starpop .55s cubic-bezier(.34, 1.8, .64, 1) backwards; }
  .winstars span:nth-child(2) { position: relative; top: -8px; }
  @keyframes starpop { from { transform: scale(0) rotate(-120deg); } }
  #solvedStats { display: block; font-size: 14px; font-weight: 700; opacity: .8; }
  .winbtns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: 6px; }
  .banner button.ghost { background: #fff; color: #a52a66; box-shadow: 0 3px 0 #d9a3bd; }

  /* Màn tổng quan: các chương, con đường qua từng level, tiến độ và sao */
  .screen[hidden] { display: none !important; }
  #home { position: relative; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px;
    padding: 12px 16px calc(28px + env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
  .homebar { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .homebar .grow { flex: 1; }
  .stat { padding: 3px 10px; border-radius: 99px; background: rgba(0,0,0,.24); color: var(--text); font-size: 14px; font-weight: 800; white-space: nowrap; }
  .hero { text-align: center; padding: 4px 0 0; }
  .hero .logo { font-size: 44px; }
  .hero p { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; font-weight: 600; }
  .overall { padding: 12px 14px; border-radius: 20px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.14); }
  .overall .row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; }
  .meter { height: 14px; margin-top: 8px; border-radius: 99px; background: rgba(0,0,0,.3); overflow: hidden; box-shadow: inset 0 2px 3px rgba(0,0,0,.35); }
  .meter i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ff7eb6, #ffc53d);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.35); transition: width .8s cubic-bezier(.3, .7, .4, 1); }
  .chapter .meter { height: 8px; margin: 6px 4px 0; }
  .playnext { height: 62px; border: 3px solid #fff; border-radius: 22px; font: inherit; font-size: 21px; font-weight: 800; line-height: 1.05; color: #5a2a00; cursor: pointer;
    background: linear-gradient(#fff3a6, #ffc53d); box-shadow: 0 5px 0 var(--gold-dark), 0 10px 22px rgba(0,0,0,.35); animation: breathe-btn 1.8s ease-in-out infinite; }
  .playnext small { display: block; font-size: 13.5px; font-weight: 700; opacity: .8; }
  .playnext:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-dark); }
  @keyframes breathe-btn { 50% { transform: scale(1.025); } }
  .chapter { padding: 14px 12px 6px; border-radius: 24px; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.1); }
  .chapter.locked { opacity: .5; }
  .chhead { display: flex; align-items: center; gap: 10px; }
  .chhead .ic { flex: none; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-size: 25px; background: rgba(0,0,0,.24); }
  .chhead h3 { margin: 0; font-size: 18px; line-height: 1.15; }
  .chhead small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .chhead .prog { margin-left: auto; text-align: right; font-size: 15px; font-weight: 800; line-height: 1.2; white-space: nowrap; }
  .chhead .prog small { color: #ffe27a; font-size: 13px; font-weight: 800; }
  .path { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 22px; }
  .path svg.roads { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .road { fill: none; stroke: rgba(0,0,0,.25); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .road.walked { stroke: #ffc53d; stroke-width: 6; stroke-dasharray: 1 13; }
  .node { position: relative; z-index: 1; justify-self: center; align-self: center; width: 58px; height: 58px; border-radius: 50%; padding: 0; cursor: pointer;
    font: inherit; font-size: 22px; font-weight: 800; color: #fff; border: 3px solid #fff;
    background: radial-gradient(circle at 35% 30%, #a465ee, #5a24a8 70%); box-shadow: 0 4px 0 #2a0c4d, 0 6px 12px rgba(0,0,0,.3); }
  .node:active { transform: translateY(3px); }
  .node.done { background: radial-gradient(circle at 35% 30%, #ffb6d3, #ef5499 70%); box-shadow: 0 4px 0 #a52a66, 0 6px 12px rgba(0,0,0,.3); }
  .node.cur { border-color: var(--gold); animation: glow-node 1.1s ease-in-out infinite alternate; }
  @keyframes glow-node { to { box-shadow: 0 4px 0 #2a0c4d, 0 0 0 6px rgba(255,197,61,.35), 0 0 24px 8px rgba(255,197,61,.55); } }
  .node.lock { background: #4a3a5a; border-color: #7b6a8c; color: #a597b3; box-shadow: 0 4px 0 #2a1f35; font-size: 18px; }
  .node .stars { position: absolute; left: 50%; top: -17px; transform: translateX(-50%); font-size: 17px; letter-spacing: -2px; white-space: nowrap; }
  .node .stars span { display: inline-block; color: #8a6aa0; text-shadow: 0 2px 0 #3a1d4d; }
  .node .stars span.on { color: #ffd23f; text-shadow: 0 2px 0 #a86a00; }
  .node .stars span:nth-child(2) { position: relative; top: -5px; }
  .node.fresh .stars span.on { animation: starpop .55s cubic-bezier(.34, 1.8, .64, 1) backwards; }
  .node.fresh .stars span:nth-child(2) { animation-delay: .18s; }
  .node.fresh .stars span:nth-child(3) { animation-delay: .36s; }

<script>
'use strict';
// ==LOGIC==
// Ký hiệu ô trong rows:
//   # ngoài cơ thể     . ô trống            ~ ô độc (tế bào vào là chết, không cần lấp)
//   A B C tế bào       a b c tế bào đang ngủ  G vi khuẩn
//   ^ v < > virus, mũi tên là hướng nó lan
// Trường thêm: goal = vòng mục tiêu (chữ cái = vòng cần tế bào màu đó, . = không có vòng);
// oneway = [[hàng, cột, hướng]]: màng giữa ô đó và ô kề theo hướng, chỉ cho đi qua theo hướng ấy;
// kill = màu cần diệt sạch (level diệt khuẩn).
// Mỗi level một hình thân riêng. Vòng khuyên và chữ C không bao giờ lấp kín được (tối đa 6 tế bào),
// nên vòng khuyên chỉ dùng cho level mục tiêu.
const LEVELS = [
  ['A.'],                                            // thanh 2 ô
  ['AB.'],                                           // thanh 3 ô
  ['.B', '.A'],                                      // vuông 2×2
  ['.B.', '#A#'],                                    // chữ T
  ['A#.', 'B..'],                                    // chữ U
  ['#A#', '...', '#B#'],                             // dấu cộng
  ['B..', 'A..'],                                    // chữ nhật 2×3
  ['.#B', '...', '.#A'],                             // chữ H
  ['.B#', '..#', 'A..'],                             // chữ L dày
  ['..A', '...', 'B..'],                             // vuông 3×3
  ['BC..', '.#..', '.A..'],                          // 3×4 khuyết một ô
  ['C..A', '....', '##.#', '...B'],                  // 4×4 thắt eo
  // Level "vào vị trí": thắng khi mọi vòng tròn có tế bào đúng màu
  { rows: ['A..', '.B#'], goal: ['..A', '...'] },                                       // chữ L
  { rows: ['A...', '#.B#'], goal: ['...B', '..A.'] },                                   // chữ T rộng
  { rows: ['B..#', '#.A.'], goal: ['..B.', '.A..'] },                                   // bậc thang
  { rows: ['...B', 'A...'], goal: ['..BA', '....'] },                                   // chữ nhật 2×4
  { rows: ['#..#', '.B.A', '#.A#'], goal: ['..A.', '...B', '..A.'] },                   // chữ thập rộng
  { rows: ['A..', '.#.', '.B.'], goal: ['..B', '..A', '...'] },                         // vòng khuyên
  { rows: ['..#', 'B.A', '#.C'], goal: ['C..', '.A.', '..B'] },                         // chữ S
  { rows: ['.#A.', '....', '.#..', '.B.C'], goal: ['A...', '.A..', '....', '.C..'] },   // 4×4 hai lỗ
  // Cơ chế mới: mỗi cơ chế một level nhập môn rồi một level khó hơn, cuối cùng một level tổng hợp
  { rows: ['#..', 'AB#', '#.#'], oneway: [[1, 1, 'up']] },                               // chữ F · màng một chiều
  { rows: ['...', '.A.', '#B#'], oneway: [[1, 0, 'right'], [0, 2, 'down']] },             // chữ T béo · màng
  ['AB~', '#.#', '#.#'],                                                                  // chữ T cao · ô độc
  ['~..~.', 'B..A.'],                                                                     // chữ nhật 2×5 · ô độc
  ['.B.', '.a#', 'A##'],                                                                  // tam giác · tế bào ngủ
  ['b.A..', '.B#..'],                                                                     // 2×5 khuyết · tế bào ngủ
  ['~<.AB'],                                                                              // thanh 5 ô · virus
  ['A.B', '...', '>.#'],                                                                  // 3×3 thiếu góc · virus
  { rows: ['.G#', '#A#', '#G.'], kill: 'G' },                                             // chữ Z · diệt khuẩn
  { rows: ['.A.#', 'B.~G', '#..G'], kill: 'G' },                                          // 3×4 lệch · diệt khuẩn + ô độc
  { rows: ['BA##', '..~#', '..a.'], oneway: [[2, 2, 'left']] },                           // bậc thang · tổng hợp
];

const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
const VIRUS = { '^': 'up', v: 'down', '<': 'left', '>': 'right' };
const ARROW = { up: '^', down: 'v', left: '<', right: '>' };

function parseLevel(def) {
  const d = Array.isArray(def) ? { rows: def } : def;
  const h = d.rows.length, w = d.rows[0].length;
  const level = { h, w, slot: [], toxic: [], init: [], target: [], oneway: [], blocked: new Set(), kill: d.kill || null };
  let id = 0;
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const ch = d.rows[r][c], t = d.goal ? d.goal[r][c] : '.';
    level.slot.push(ch !== '#');
    level.toxic.push(ch === '~');
    let cell = null;
    if (VIRUS[ch]) cell = { color: 'V', dir: VIRUS[ch], id: id++ };
    else if (/[A-Z]/.test(ch)) cell = { color: ch, id: id++ };
    else if (/[a-z]/.test(ch)) cell = { color: ch.toUpperCase(), sleep: true, id: id++ };
    level.init.push(cell);
    level.target.push(/[A-Z]/.test(t) ? t : null);
  }
  // Màng cho đi i -> j theo `dir`, chặn chiều ngược lại
  for (const [r, c, dir] of d.oneway || []) {
    const i = r * w + c, j = (r + DIRS[dir][0]) * w + c + DIRS[dir][1];
    level.oneway.push([i, j, dir]);
    level.blocked.add(j + OPPOSITE[dir]);
  }
  level.nextId = id;
  level.hasTarget = level.target.some(Boolean);
  level.colors = [...new Set(level.init.filter(c => c && c.color !== 'V' && c.color !== level.kill).map(c => c.color))];
  level.init = wake(level, level.init);
  return level;
}

// Ô kế tiếp theo hướng; -1 nếu ra ngoài bàn, ngoài cơ thể, hoặc bị màng chặn.
function step(level, i, dir) {
  const r = Math.floor(i / level.w) + DIRS[dir][0], c = i % level.w + DIRS[dir][1];
  if (r < 0 || c < 0 || r >= level.h || c >= level.w) return -1;
  const j = r * level.w + c;
  return level.slot[j] && !level.blocked.has(i + dir) ? j : -1;
}

// Các ô kề (bỏ qua màng), dùng để đánh thức tế bào ngủ.
function near(level, i) {
  const out = [];
  for (const dir in DIRS) {
    const r = Math.floor(i / level.w) + DIRS[dir][0], c = i % level.w + DIRS[dir][1];
    if (r >= 0 && c >= 0 && r < level.h && c < level.w && level.slot[r * level.w + c]) out.push(r * level.w + c);
  }
  return out;
}

// Mọi dãy ngang/dọc từ 3 tế bào cùng màu trở lên. Virus không tạo dãy.
function findRuns(level, cells) {
  const out = new Set();
  const colorAt = i => cells[i] && cells[i].color !== 'V' ? cells[i].color : null;
  const scan = (start, stride, count) => {
    let runStart = 0;
    for (let k = 1; k <= count; k++) {
      const prev = colorAt(start + (k - 1) * stride);
      const cur = k < count ? colorAt(start + k * stride) : null;
      if (cur && cur === prev) continue;
      if (prev && k - runStart >= 3) for (let j = runStart; j < k; j++) out.add(start + j * stride);
      runStart = k;
    }
  };
  for (let r = 0; r < level.h; r++) scan(r * level.w, 1, level.w);
  for (let c = 0; c < level.w; c++) scan(c, level.w, level.h);
  return [...out];
}

// Giết mọi tế bào đang đứng trên ô độc, ghi chúng vào `dead`.
function poison(level, cells, dead) {
  let out = cells;
  level.toxic.forEach((t, i) => {
    if (!t || !out[i]) return;
    if (out === cells) out = cells.slice();
    dead.push(out[i]);
    out[i] = null;
  });
  return out;
}

// Tế bào ngủ thức dậy khi đứng cạnh một tế bào cùng màu đang thức (lan dây chuyền).
function wake(level, cells) {
  let out = cells;
  for (let changed = true; changed;) {
    changed = false;
    for (let i = 0; i < out.length; i++) {
      const c = out[i];
      if (!c || !c.sleep || !near(level, i).some(j => out[j] && !out[j].sleep && out[j].color === c.color)) continue;
      if (out === cells) out = cells.slice();
      out[i] = { ...c, sleep: false };
      changed = true;
    }
  }
  return out;
}

// Kết thúc một lượt sau khi bản sao đã vào chỗ: ô độc giết, khử 3, virus lan (vào ô trống hoặc ăn tế bào),
// ô độc giết tiếp, rồi tế bào ngủ thức dậy. Trả từng chặng để giao diện diễn hoạt.
function resolve(level, placed, born, nextId) {
  const removed = [];
  let cells = poison(level, placed, removed);
  const runs = findRuns(level, cells);
  if (runs.length) {
    cells = cells.slice();
    for (const i of runs) { removed.push(cells[i]); cells[i] = null; }
  }
  const cleared = cells;
  const viruses = [], spread = [], eaten = [];
  cells.forEach((c, i) => { if (c && c.color === 'V') viruses.push(i); });
  if (viruses.length) cells = cells.slice();
  for (const i of viruses) {
    const j = step(level, i, cells[i].dir);
    if (j < 0 || (cells[j] && cells[j].color === 'V')) continue;
    if (cells[j]) eaten.push(cells[j]);
    cells[j] = { color: 'V', dir: cells[i].dir, id: nextId++ };
    spread.push([cells[j].id, i]);
  }
  const infected = cells;
  const poisoned = [];
  cells = wake(level, poison(level, cells, poisoned));
  return { moved: placed, removed, cleared, spread, eaten, infected, poisoned, cells, born, nextId };
}

// Vuốt tế bào `from` theo `dir`. Bản sao vào ô kề; nếu ô kề có tế bào thì đẩy cả dãy tới ô trống gần nhất
// theo hướng đó, không còn ô trống thì bản sao thay thế tế bào kề. Sau đó kết thúc lượt (resolve).
// Trả null nếu không vuốt được (tế bào ngủ, virus, ra ngoài, hoặc thay thế một tế bào cùng màu).
function swipe(level, cells, from, dir, newId = -1) {
  const parent = cells[from];
  const to = step(level, from, dir);
  if (!parent || parent.sleep || parent.color === 'V' || to < 0) return null;
  const chain = [];
  let k = to;
  while (k >= 0 && cells[k]) { chain.push(k); k = step(level, k, dir); }
  const next = cells.slice();
  let pushed = false, replaced = null;
  if (k >= 0) {
    for (let i = chain.length - 1; i >= 0; i--) next[step(level, chain[i], dir)] = cells[chain[i]];
    pushed = chain.length > 0;
  } else {
    if (cells[to].color === parent.color) return null;
    replaced = cells[to];
  }
  next[to] = { color: parent.color, id: newId };
  return { ...resolve(level, next, [newId, from], newId + 1), pushed, replaced };
}

// Booster Đột biến: đổi một tế bào sang màu loài khác. Không cho đổi tế bào cuối cùng của một loài.
function mutate(level, cells, i, color, newId = -1) {
  const c = cells[i];
  if (!c || c.color === 'V' || c.color === color || !level.colors.includes(color)) return null;
  if (level.colors.includes(c.color) && !cells.some((o, j) => j !== i && o && o.color === c.color)) return null;
  const next = cells.slice();
  next[i] = { color, id: newId };
  return resolve(level, next, [newId, i], newId + 1);
}

// Booster Cấy ghép: bản sao của tế bào `from` mọc ở một ô trống bất kỳ (trừ ô độc), không đẩy gì.
function transplant(level, cells, from, to, newId = -1) {
  const c = cells[from];
  if (!c || c.color === 'V' || !level.slot[to] || level.toxic[to] || cells[to]) return null;
  const next = cells.slice();
  next[to] = { color: c.color, id: newId };
  return resolve(level, next, [newId, from], newId + 1);
}

// Lấp kín: mọi ô (trừ ô độc) có tế bào không phải virus.
const isFull = (level, cells) => level.slot.every((s, i) => !s || level.toxic[i] || (cells[i] && cells[i].color !== 'V'));
const keyOf = cells => cells.map(c => !c ? '.' : c.color === 'V' ? ARROW[c.dir] : c.sleep ? c.color.toLowerCase() : c.color).join('');

// Các loài có mặt lúc đầu nhưng nay không còn tế bào nào (kể cả đang ngủ). Có loài tuyệt chủng là thua.
const extinct = (level, cells) => level.colors.filter(col => !cells.some(c => c && c.color === col));
const isLost = (level, cells) => extinct(level, cells).length > 0;
// Diệt khuẩn: hết vi khuẩn. Mục tiêu: mọi vòng đúng màu. Còn lại: lấp kín.
const isComplete = (level, cells) => level.kill ? !cells.some(c => c && c.color === level.kill)
  : level.hasTarget ? level.target.every((t, i) => !t || (cells[i] && cells[i].color === t))
  : isFull(level, cells);
const isWon = (level, cells) => isComplete(level, cells) && !isLost(level, cells);

function allMoves(level, cells) {
  const moves = [];
  cells.forEach((c, i) => { if (c && !c.sleep && c.color !== 'V') for (const dir in DIRS) moves.push([i, dir]); });
  return moves;
}

// BFS (bỏ qua id): chuỗi vuốt ngắn nhất để thắng mà không loài nào tuyệt chủng;
// null nếu đã thua hoặc không tìm thấy trong giới hạn.
function solve(level, start, maxNodes = 80000) {
  if (isLost(level, start)) return null;
  if (isComplete(level, start)) return [];
  const startKey = keyOf(start);
  const parent = new Map([[startKey, null]]);
  const queue = [start];
  for (let q = 0; q < queue.length && parent.size < maxNodes; q++) {
    const cells = queue[q], key = keyOf(cells);
    for (const [from, dir] of allMoves(level, cells)) {
      const res = swipe(level, cells, from, dir);
      if (!res) continue;
      const k2 = keyOf(res.cells);
      if (parent.has(k2)) continue;
      parent.set(k2, [key, from, dir]);
      if (isLost(level, res.cells)) continue;
      if (isComplete(level, res.cells)) {
        const path = [];
        for (let k = k2; parent.get(k); k = parent.get(k)[0]) path.unshift(parent.get(k).slice(1));
        return path;
      }
      queue.push(res.cells);
    }
  }
  return null;
}

// Âm thanh tổng hợp bằng Web Audio (không cần file). Ngữ cảnh âm thanh mở ở lần chạm đầu tiên.
// ---------------------------------------------------------------------------
const sfx = (() => {
  let ac = null;
  const audio = () => {
    if (save.muted) return null;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  };
  // Một nốt: tần số trượt từ f tới f2, tắt dần trong t giây
  function tone(f, f2, t, { type = 'sine', vol = .16, at = 0 } = {}) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + t);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + t);
    o.connect(g).connect(a.destination);
    o.start(t0);
    o.stop(t0 + t + .03);
  }
  // Tiếng ồn qua bộ lọc dải: xèo, phụt
  function hiss(t, { freq = 1500, q = .8, vol = .12, at = 0 } = {}) {
    const a = audio(); if (!a) return;
    const n = Math.floor(a.sampleRate * t), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination);
    s.start(a.currentTime + at);
  }
  const notes = (list, gap, opts) => list.forEach((f, k) => tone(f, f * 1.01, .2, { ...opts, at: k * gap }));
  return {

// ---------------------------------------------------------------------------
// Hạt hiệu ứng vẽ trên canvas phủ lên bàn chơi
// ---------------------------------------------------------------------------
const fx = (() => {
  const cv = $('fx'), g = cv.getContext('2d');
  let parts = [], last = 0, running = false;
  const rand = (a, b) => a + Math.random() * (b - a);
  function fit() {
    const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    const w = Math.round(r.width * d), h = Math.round(r.height * d);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    g.setTransform(d, 0, 0, d, 0, 0);
  }
  // Tâm ô i (đơn vị SVG) -> px trên canvas, kèm tỉ lệ px trên một đơn vị SVG
  function center(i) {
    const [x, y] = pos(i), m = board.getScreenCTM(), r = cv.getBoundingClientRect();
    return [m.a * (x + SZ / 2) + m.e - r.left, m.d * (y + SZ / 2) + m.f - r.top, m.a];
  }
  function add(p) {
    parts.push({ age: 0, vx: 0, vy: 0, ...p });
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
  }
  function star(x, y, r) {
    g.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .35 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    g.closePath(); g.fill();
  }
  function draw(p, k) {
    g.fillStyle = g.strokeStyle = p.color;
    if (p.kind === 'dot') { g.beginPath(); g.arc(p.x, p.y, Math.max(.1, p.r * (1 - k * .5)), 0, 7); g.fill(); }
    else if (p.kind === 'ring') { g.lineWidth = Math.max(.1, p.w * (1 - k)); g.beginPath(); g.arc(p.x, p.y, p.r + p.grow * k, 0, 7); g.stroke(); }
    else if (p.kind === 'puff') { g.beginPath(); g.arc(p.x, p.y, p.r * (.6 + k), 0, 7); g.fill(); }
    else if (p.kind === 'star') star(p.x, p.y, Math.max(.1, p.r * (1 - Math.abs(k - .35))));
    else if (p.kind === 'conf') { g.save(); g.translate(p.x, p.y); g.rotate(p.spin * p.age); g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); g.restore(); }
    else if (p.kind === 'text') {
      g.font = `800 ${p.r}px 'Baloo 2', system-ui, sans-serif`; g.textAlign = 'center';
      g.lineWidth = 5; g.strokeStyle = '#3a1050'; g.strokeText(p.text, p.x, p.y); g.fillText(p.text, p.x, p.y);
    }
  }
  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    fit();
    g.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => (p.age += dt) < p.life);
    for (const p of parts) {
      p.vy += (p.grav || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      g.globalAlpha = Math.max(0, 1 - p.age / p.life) * (p.alpha ?? 1);
      draw(p, p.age / p.life);
    }
    g.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(tick);
    else { running = false; g.clearRect(0, 0, cv.width, cv.height); }
  }
  return {
    clear() { parts = []; },
    // giọt kẹo bắn tung khi tế bào vỡ
    burst(i, color, n = 12) {
      const [x, y, s] = center(i);
      for (let k = 0; k < n; k++) {
        const a = rand(0, 6.28), v = rand(80, 230) * s;
        add({ kind: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 70 * s, grav: 650 * s, r: rand(3, 7.5) * s, life: rand(.45, .8), color });
      }
    },
    ring(i, color, size = 1) { const [x, y, s] = center(i); add({ kind: 'ring', x, y, r: 22 * s, grow: 64 * s * size, w: 9 * s, life: .45, color }); },
    sparkle(i, color = '#fff6b0', n = 8) {
      const [x, y, s] = center(i);
      for (let k = 0; k < n; k++) {
        const a = rand(0, 6.28), v = rand(30, 120) * s;
        add({ kind: 'star', x: x + Math.cos(a) * 22 * s, y: y + Math.sin(a) * 22 * s, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rand(5, 10) * s, life: rand(.5, .85), color });
      }
    },
    smoke(i) {
      const [x, y, s] = center(i);
      for (let k = 0; k < 10; k++) add({ kind: 'puff', x: x + rand(-18, 18) * s, y: y + rand(-10, 10) * s, vx: rand(-25, 25) * s, vy: rand(-95, -40) * s,
        r: rand(10, 18) * s, life: rand(.6, 1), alpha: .55, color: k % 3 ? '#a6dc3f' : '#56751c' });
    },
    splat(i) {
      const [x, y, s] = center(i);
      for (let k = 0; k < 12; k++) {
        const a = rand(0, 6.28), v = rand(60, 170) * s;
        add({ kind: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, grav: 220 * s, r: rand(3, 6.5) * s, life: .55, color: k % 2 ? '#b56cff' : '#6b2fb5' });
      }
    },
    rainbow(i) {
      const [x, y, s] = center(i);
      ['#ff5d73', '#ffd23f', '#84db4c', '#4f8dff', '#b56cff'].forEach((color, k) =>
        add({ kind: 'ring', x, y, r: (8 + k * 7) * s, grow: 54 * s, w: 7 * s, life: .5 + k * .06, color }));
      this.sparkle(i, '#ffffff', 12);
    },
    trail(from, to, color) {
      const [x1, y1, s] = center(from), [x2, y2] = center(to);
      for (let k = 0; k <= 16; k++) {
        const t = k / 16;
        add({ kind: 'star', x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t - Math.sin(t * Math.PI) * 46 * s, vy: -18 * s,
          r: 8 * s, life: .3 + t * .4, color: k % 2 ? '#ffffff' : color });
      }
    },
    text(i, str, color = '#fff', size = 30) { const [x, y, s] = center(i); add({ kind: 'text', x, y: y - 24 * s, vy: -70 * s, r: size * s, life: 1.1, text: str, color }); },
    confetti() {
      const r = cv.getBoundingClientRect(), colors = ['#ff5d73', '#ffd23f', '#84db4c', '#4f8dff', '#b56cff', '#ffffff'];
      for (let k = 0; k < 110; k++) add({ kind: 'conf', x: rand(0, r.width), y: rand(-30, r.height * .35), vx: rand(-70, 70), vy: rand(-260, 30),
        grav: 430, r: rand(4, 8), spin: rand(-12, 12), life: rand(1.4, 2.3), color: colors[k % colors.length] });
    },
    glow() {
      const r = cv.getBoundingClientRect();
      for (let k = 0; k < 46; k++) add({ kind: 'star', x: rand(0, r.width), y: rand(r.height * .3, r.height), vx: rand(-15, 15), vy: rand(-170, -60),
        r: rand(5, 12), life: rand(.8, 1.5), color: k % 3 ? '#ffe27a' : '#ffffff' });
    },
  };
})();

const stage = $('stage');
// Chạy lại một hiệu ứng CSS một lần (rung, loé sáng, nảy nút)
function jolt(el, cls) { el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }

// ---------------------------------------------------------------------------
// Tim: thua mất 1 tim; dưới mức tối đa thì hồi dần theo thời gian thực
// ---------------------------------------------------------------------------
function regen() {
  let changed = false;
  while (save.hearts < MAX_HEARTS && save.heartAt && Date.now() - save.heartAt >= REGEN_MS) {
    save.hearts++;
    save.heartAt += REGEN_MS;
    changed = true;
  }
  if (save.hearts >= MAX_HEARTS && save.heartAt) { save.heartAt = null; changed = true; }
  if (changed) persist();
  return changed;
}

function setHearts(n) {
  if (n < save.hearts && save.hearts === MAX_HEARTS) save.heartAt = Date.now();
  save.hearts = Math.max(0, Math.min(MAX_HEARTS, n));
  if (save.hearts === MAX_HEARTS) save.heartAt = null;
  persist();
}

const outOfHearts = () => save.hearts === 0 && !lost;
const clock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function renderHearts(hit = -1, cls = 'hit') {
  $('hearts').innerHTML = $('homeHearts').innerHTML = Array.from({ length: MAX_HEARTS }, (_, k) =>
    `<span class="${k < save.hearts ? '' : 'empty'}${k === hit ? ' ' + cls : ''}">♥</span>`).join('');
}

function renderClock() {
  const left = save.heartAt ? clock(save.heartAt + REGEN_MS - Date.now()) : '';
  $('regen').textContent = $('homeRegen').textContent = save.hearts < MAX_HEARTS ? `+1 tim sau ${left}` : 'Tim đầy';
  $('nhText').textContent = `Tim tiếp theo sau ${left}`;
  $('nohearts').classList.toggle('show', screen === 'game' && outOfHearts());
}

// ---------------------------------------------------------------------------
// Vẽ: dùng chung cho bàn chơi, ảnh minh hoạ trong thẻ hướng dẫn và biểu tượng đếm loài
// ---------------------------------------------------------------------------
const pos = (i, lv = level) => [(i % lv.w) * SZ, Math.floor(i / lv.w) * SZ];
const pt = (m, a, r) => `${(m + r * Math.cos(a)).toFixed(1)} ${(m + r * Math.sin(a)).toFixed(1)}`;
// Kẹo chanh hình bông 6 cánh và quả cầu gai của virus
const FLOWER = (() => {
  const m = SZ / 2;
  let d = '';
  for (let k = 0; k < 6; k++) {
    const a0 = (k * 60 - 90) * Math.PI / 180, a1 = a0 + Math.PI / 3;
    d += (k ? '' : `M${pt(m, a0, 31)}`) + ` Q${pt(m, a0 + Math.PI / 6, 47)} ${pt(m, a1, 31)}`;
  }
  return d + ' Z';
})();
const SPIKES = Array.from({ length: 24 }, (_, k) => pt(SZ / 2, Math.PI * k / 12, k % 2 ? 30 : 40).replace(' ', ',')).join(' ');

function cellShape(c) {
  const m = SZ / 2, fill = `url(#g-${c.color})`, dark = COLORS[c.color][1];
  if (c.color === 'B') return `<rect x="${m - 35}" y="${m - 35}" width="70" height="70" rx="24" fill="${fill}" stroke="${dark}" stroke-width="3"/>`;
  if (c.color === 'C') return `<path d="${FLOWER}" fill="${fill}" stroke="${dark}" stroke-width="3" stroke-linejoin="round"/>`;
  if (c.color === 'V') return `<polygon class="spikes" points="${SPIKES}" fill="${fill}" stroke="${dark}" stroke-width="3" stroke-linejoin="round"/>`;
  if (c.color === 'G') return `<path class="flag" d="M${m - 31} ${m + 8} q-12 2 -13 15 M${m + 31} ${m - 8} q12 -2 13 -15" stroke="${dark}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <rect x="${m - 34}" y="${m - 22}" width="68" height="44" rx="22" fill="${fill}" stroke="${dark}" stroke-width="3"/>`;
  return `<circle cx="${m}" cy="${m}" r="36" fill="${fill}" stroke="${dark}" stroke-width="3"/>`;
}

// Mặt: tế bào ngủ nhắm mắt; virus cau mày và nhìn về hướng sắp lan; vi khuẩn cười nhếch.
function face(c, delay) {
  const m = SZ / 2, ink = '#2b0f2e';
  if (c.sleep) return `<path d="M${m - 17} ${m - 4} q6 6 12 0 M${m + 5} ${m - 4} q6 6 12 0" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="${m}" cy="${m + 11}" rx="3.5" ry="4.5" fill="${ink}"/>`;
  const [lx, ly] = c.color === 'V' ? LOOK[c.dir] : [0, 0];
  const eyes = `<g class="eyes" style="animation-delay:-${delay}s">
    <ellipse cx="${m - 11}" cy="${m - 4}" rx="7.5" ry="8.5" fill="#fff"/><ellipse cx="${m + 11}" cy="${m - 4}" rx="7.5" ry="8.5" fill="#fff"/>
    <g class="look" style="transform:translate(${lx * 3}px,${ly * 3}px)">
      <circle cx="${m - 11}" cy="${m - 3}" r="4.3" fill="${ink}"/><circle cx="${m + 11}" cy="${m - 3}" r="4.3" fill="${ink}"/>
      <circle cx="${m - 12.5}" cy="${m - 5}" r="1.5" fill="#fff"/><circle cx="${m + 9.5}" cy="${m - 5}" r="1.5" fill="#fff"/></g></g>`;
  if (c.color === 'V') return `${eyes}<path d="M${m - 19} ${m - 16} l10 5 M${m + 19} ${m - 16} l-10 5" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M${m - 9} ${m + 13} l3 -4 l3 4 l3 -4 l3 4 l3 -4" stroke="${ink}" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (c.color === 'G') return `${eyes}<path d="M${m - 7} ${m + 10} q7 4 13 -3" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return `${eyes}<ellipse cx="${m - 21}" cy="${m + 8}" rx="5" ry="3" fill="#ff8fb5" opacity=".75"/><ellipse cx="${m + 21}" cy="${m + 8}" rx="5" ry="3" fill="#ff8fb5" opacity=".75"/>
    <path d="M${m - 6} ${m + 8} q6 6 12 0" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
}

// Một tế bào, gốc toạ độ ở góc ô: bóng đổ, thân kẹo, vệt bóng, mặt, chữ z khi ngủ.
function cellBody(c) {
  const m = SZ / 2, d = ((Math.abs(c.id) * .73) % 5).toFixed(2);
  return `<g class="body"><g class="jelly" style="animation-delay:-${(d * .55).toFixed(2)}s">
      <ellipse cx="${m}" cy="${m + 38}" rx="25" ry="5" fill="#4a0a32" opacity=".25"/>
      ${cellShape(c)}
      <ellipse cx="${m - 13}" cy="${m - 20}" rx="11" ry="5.5" fill="#fff" opacity=".6" transform="rotate(-32 ${m - 13} ${m - 20})"/>
      ${face(c, d)}
    </g></g>
    <g class="zz" fill="#fff" stroke="#5b2380" stroke-width="5" paint-order="stroke" stroke-linejoin="round" font-weight="800">
      <text x="${SZ - 30}" y="22" font-size="28">z</text><text x="${SZ - 14}" y="6" font-size="19">z</text></g>`;
}

const icon = col => `<svg viewBox="-4 -6 98 104">${cellBody({ color: col, id: 1, dir: 'right' })}</svg>`;

// Thân sinh vật (thạch hồng), ô độc sủi bọt và vòng mục tiêu. Có `cells` thì tô vòng đã đạt.
function baseSvg(lv, cells = null) {
  let shadow = '', body = '', cups = '';
  lv.slot.forEach((s, i) => {
    if (!s) return;
    const [x, y] = pos(i, lv);
    shadow += `<rect x="${x - 16}" y="${y - 6}" width="${SZ + 32}" height="${SZ + 32}" rx="36"/>`;
    body += `<rect x="${x - 16}" y="${y - 16}" width="${SZ + 32}" height="${SZ + 32}" rx="36"/>`;
    if (!lv.toxic[i]) { cups += `<rect x="${x + 2}" y="${y + 2}" width="${SZ - 4}" height="${SZ - 4}" rx="22" fill="url(#g-cup)" stroke="#ff9cc4" stroke-width="2"/>`; return; }
    cups += `<rect x="${x + 2}" y="${y + 2}" width="${SZ - 4}" height="${SZ - 4}" rx="22" fill="url(#g-toxic)" stroke="#5f8a14" stroke-width="2.5"/>
      <text x="${x + SZ / 2}" y="${y + SZ / 2 + 13}" text-anchor="middle" font-size="36" fill="#476b0d" opacity=".7">☠</text>` +
      [[22, 64, 6, 0], [64, 70, 8, .7], [46, 60, 5, 1.4], [70, 40, 4, .35]].map(([bx, by, r, dl]) =>
        `<circle class="bub" cx="${x + bx}" cy="${y + by}" r="${r}" fill="#f4ffc9" style="animation-delay:-${dl}s"/>`).join('');
  });
  let rings = '';
  lv.target.forEach((t, i) => {
    if (!t) return;
    const [x, y] = pos(i, lv), ok = cells && cells[i] && cells[i].color === t;
    rings += `<circle class="ring${ok ? ' ok' : ''}" data-i="${i}" cx="${x + SZ / 2}" cy="${y + SZ / 2}" r="42" fill="${COLORS[t][0]}" stroke="${COLORS[t][1]}"
      style="animation-delay:-${i * 1.3}s"/>`;
  });
  return `<g fill="#1a0526" opacity=".4">${shadow}</g><g fill="url(#g-body)">${body}</g>${cups}${rings}`;
}

// Màng một chiều: dải thạch xanh ngọc trên cạnh giữa hai ô, mũi tên nhích theo chiều được đi qua.
function wallsSvg(lv) {
  return lv.oneway.map(([i, j, dir]) => {
    const [x1, y1] = pos(i, lv), [x2, y2] = pos(j, lv);
    const cx = (x1 + x2) / 2 + SZ / 2, cy = (y1 + y2) / 2 + SZ / 2;
    const bar = dir === 'left' || dir === 'right'
      ? `<rect x="${cx - 6}" y="${cy - 38}" width="12" height="76" rx="6"/>`
      : `<rect x="${cx - 38}" y="${cy - 6}" width="76" height="12" rx="6"/>`;
    return `<g fill="url(#g-gel)" stroke="#0f7062" stroke-width="2.5">${bar}</g>
      <g transform="rotate(${ANGLE[dir]} ${cx} ${cy})"><circle cx="${cx}" cy="${cy}" r="15" fill="#0f7062" stroke="#fff" stroke-width="2.5"/>
      <path class="chev" d="M${cx - 5} ${cy - 8} L${cx + 4} ${cy} L${cx - 5} ${cy + 8}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  }).join('');
}

// Mũi tên xem trước hướng chia: trắng nếu chia được, đỏ nếu bị chặn.
function arrowSvg(lv, from, dir) {
  const [x, y] = pos(from, lv).map(v => v + SZ / 2);
  const col = step(lv, from, dir) < 0 ? '#ff4d6d' : '#ffffff';
  return `<g transform="rotate(${ANGLE[dir]} ${x} ${y})" opacity=".95" stroke-linecap="round">
    <path d="M${x + 12} ${y} H${x + 56}" stroke="#3a1050" stroke-width="17"/><path d="M${x + 12} ${y} H${x + 56}" stroke="${col}" stroke-width="9"/>
    <path d="M${x + 52} ${y - 15} L${x + 76} ${y} L${x + 52} ${y + 15} Z" fill="${col}" stroke="#3a1050" stroke-width="4" stroke-linejoin="round"/></g>`;
}

// Ảnh tĩnh của một bàn (dùng trong thẻ hướng dẫn).
function boardSvg(lv, view, from = -1, dir = null) {
  let out = baseSvg(lv, view);
  view.forEach((c, i) => {
    if (!c) return;
    const [x, y] = pos(i, lv);
    out += `<g class="cell${c.sleep ? ' asleep' : ''}" transform="translate(${x} ${y})">${cellBody(c)}</g>`;
  });
  out += wallsSvg(lv) + (dir ? arrowSvg(lv, from, dir) : '');
  return `<svg viewBox="-24 -24 ${lv.w * SZ + 48} ${lv.h * SZ + 52}">${out}</svg>`;
}

// ---------------------------------------------------------------------------
// Bàn chơi
// ---------------------------------------------------------------------------
function load(i) {
  index = Math.max(0, Math.min(LEVELS.length - 1, i));
  level = parseLevel(LEVELS[index]);
  cells = level.init.slice();
  nextId = level.nextId;
  history = [];
  mode = null;
  fx.clear();
  save.level = index;
  persist();
  $('sub').textContent = `Level ${index + 1}/${LEVELS.length}`;
  $('goal').textContent = goalOf(level);
  $('goalNote').textContent = level.kill ? 'Các màu khác phải còn sống' : 'Màu nào mất hết tế bào là thua';
  $('solvedText').textContent = level.kill ? '🎉 Sạch bóng vi khuẩn!' : level.hasTarget ? '🎉 Vào đúng vị trí!' : '🎉 Sinh vật đã đầy!';
  $('next').disabled = index === LEVELS.length - 1 || !unlocked(index + 1);
  // Tính số lần vuốt tối ưu sau khi màn đã hiện, để bộ đếm có mốc 3 sao
  const at = index;
  if (!parCache.has(at)) setTimeout(() => { parOf(at); if (screen === 'game' && at === index) update(); }, 60);
  buildBoard();
  sync(cells);
  ringsOk = new Set(level.target.map((t, k) => t && cells[k] && cells[k].color === t ? k : -1).filter(k => k >= 0));
  toast('', 0);
  renderHearts();
  update();
  const fresh = MECHANICS.filter(m => m.has(level, index) && !save.seen.includes(m.key));
  if (fresh.length) showLearn(fresh, true);
}

const goalOf = lv => lv.kill ? '🧫 Diệt sạch vi khuẩn'
  : lv.hasTarget ? '🎯 Đưa tế bào đúng màu vào mọi vòng tròn'
  : '🧪 Lấp kín cơ thể' + (lv.toxic.some(Boolean) ? ' (trừ ô độc)' : '') + (hasVirus(lv) ? ', diệt hết virus' : '');

function buildBoard() {
  board.setAttribute('viewBox', `-24 -24 ${level.w * SZ + 48} ${level.h * SZ + 52}`);
  board.innerHTML = `${baseSvg(level)}<g id="layer"></g><g>${wallsSvg(level)}</g><g id="overlay"></g>`;
  layer = $('layer');
  overlay = $('overlay');
  nodes = new Map();
}

function makeCell(c) {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'cell');
  g.innerHTML = cellBody(c);
  g.dataset.sleep = c.sleep ? '1' : '';
  return g;
}

// Đồng bộ DOM với mảng tế bào: tế bào cũ trượt tới chỗ mới, tế bào mới mọc ra từ ô mẹ (`born`: id -> ô).
// `keep`: tế bào đã rời bàn nhưng còn đang vỡ. Tế bào vừa thức dậy được vẽ lại với mắt mở.
function sync(view, born = null, keep = []) {
  shown = view;
  const alive = new Set(keep.map(c => c.id));
  view.forEach((c, i) => {
    if (!c) return;
    alive.add(c.id);
    let g = nodes.get(c.id);
    const [x, y] = pos(i);
    if (!g) {
      g = makeCell(c);
      nodes.set(c.id, g);
      layer.appendChild(g);
      const from = born && born.get(c.id);
      if (from !== undefined && from !== null) {
        const [fx0, fy0] = pos(from);
        g.style.transform = `translate(${fx0}px, ${fy0}px)`;
        g.classList.add('born');
        g.getBoundingClientRect();           // ép trình duyệt ghi nhận vị trí đầu trước khi trượt
      }
    } else if (!!c.sleep !== !!g.dataset.sleep) {
      g.innerHTML = cellBody(c);
      g.dataset.sleep = c.sleep ? '1' : '';
      if (!c.sleep) jolt(g, 'waking');
    }
    g.classList.toggle('asleep', !!c.sleep);
    g.style.transform = `translate(${x}px, ${y}px)`;
  });
  for (const [id, g] of nodes) if (!alive.has(id)) { g.remove(); nodes.delete(id); }
}

const pop = list => { for (const c of list) nodes.get(c.id)?.classList.add('pop'); };
const slotOf = (view, c) => view.indexOf(c);

// Đếm tế bào từng loài theo những gì đang hiện trên bàn; vi khuẩn và virus đếm riêng.
function renderSpecies() {
  const count = col => shown.filter(c => c && c.color === col).length;
  let out = level.colors.map(col => {
    const n = count(col);
    return `<span class="${n === 0 ? 'gone' : n === 1 ? 'low' : ''}" title="Tế bào ${NAMES[col]}">${icon(col)}${n}</span>`;
  }).join('');
  if (level.kill) out += `<span class="enemy" title="Vi khuẩn cần diệt">${icon('G')}${count('G')}</span>`;
  if (hasVirus(level)) out += `<span class="enemy" title="Virus">${icon('V')}${count('V')}</span>`;
  $('species').innerHTML = out;
}

function renderBoosters() {
  const idle = !busy && !solved && !lost && !outOfHearts();
  for (const kind in BOOSTER_NAMES) {
    const n = save.boosters[kind], badge = $('b-' + kind).querySelector('.badge');
    badge.textContent = n || '+';
    badge.classList.toggle('plus', !n);
    $('b-' + kind).classList.toggle('on', !!mode && mode.kind === kind);
  }
  $('b-mutate').disabled = !idle || (level.colors.length < 2 && !level.kill);
  $('b-clone').disabled = !idle;
  $('b-revive').disabled = !lost || busy;
  $('lostRevive').textContent = `✨ Hồi sinh (${save.boosters.revive})`;
  $('lostRevive').disabled = !save.boosters.revive;
}

function update() {
  const wasSolved = solved, wasLost = lost;
  solved = !busy && isWon(level, cells);
  lost = !busy && isLost(level, cells);
  const par = parCache.get(index);
  $('moves').textContent = `👣 ${movesNow()}` + (par ? ` · 3⭐ ≤ ${par}` : '');
  $('undo').disabled = history.length === 0 || busy || lost;
  $('hint').disabled = busy || solved || lost;
  $('solved').classList.toggle('show', solved);
  $('lost').classList.toggle('show', lost);
  if (lost) $('lostText').textContent = `😢 Tế bào ${extinct(level, cells).map(c => NAMES[c]).join(', ')} đã tuyệt chủng: ` +
    (save.hearts ? 'mất 1 tim' : 'mất 1 tim, đã hết tim');
  // Vòng mục tiêu: vòng nào vừa đạt thì loé sáng
  const ok = new Set();
  for (const el of board.querySelectorAll('.ring')) {
    const i = +el.dataset.i, hit = !!shown[i] && shown[i].color === level.target[i];
    el.classList.toggle('ok', hit);
    if (hit) ok.add(i);
  }
  for (const i of ok) if (!ringsOk.has(i)) { fx.sparkle(i, COLORS[level.target[i]][0], 10); fx.ring(i, '#ffffff', .6); sfx.ding(); }
  ringsOk = ok;
  if (solved && !wasSolved) celebrate();
  if (lost && !wasLost) mourn();
  if (!lost) layer.classList.remove('sad');
  renderSpecies();
  renderBoosters();
  renderClock();
}

// Ghi kết quả thắng: sao theo số lần vuốt so với tối ưu, giữ kết quả tốt nhất; bảng thắng hiện sao bay vào.
function recordWin() {
  const moves = movesNow(), par = parOf(index), stars = starsFor(moves, par), prev = save.done[index];
  const better = !prev || stars > prev.stars || moves < prev.best;
  save.done[index] = { stars: Math.max(stars, prev ? prev.stars : 0), best: prev ? Math.min(moves, prev.best) : moves };
  persist();
  freshWin = index;
  $('winStars').innerHTML = [1, 2, 3].map(k => `<span class="${k <= stars ? 'on' : ''}" style="animation-delay:${.2 + .18 * k}s">★</span>`).join('');
  $('solvedStats').textContent = `${moves} lần vuốt · tối ưu ${par}` + (prev && better ? ' · kỷ lục mới!' : '');
  $('continue').textContent = index < LEVELS.length - 1 ? 'Tiếp tục ›' : 'Về bản đồ';
  $('next').disabled = index === LEVELS.length - 1;
}

function celebrate() {
  recordWin();
  layer.classList.add('happy');
  setTimeout(() => layer.classList.remove('happy'), 1500);
  fx.confetti();
  sfx.win();
  buzz([20, 40, 20]);
}

function mourn() {
  layer.classList.add('sad');
  jolt(stage, 'shake');
  sfx.lose();
  buzz(60);
}

// Áp một nước (vuốt hoặc booster) theo từng chặng có hiệu ứng: bản sao mọc ra và dãy trượt, tế bào bị thay thế vỡ,
// ô độc bốc khói, bộ 3 nổ tung, virus lan và ăn tế bào, tế bào ngủ thức dậy. Thua thì trừ 1 tim.
async function commit(res, spent = null, info = {}) {
  nextId = res.nextId;
  history.push({ cells, spent });
  const before = cells;
  cells = res.cells;
  overlay.innerHTML = '';
  busy = true;
  const bornAt = res.moved.findIndex(c => c && c.id === res.born[0]);
  const gone = info.gone ? [info.gone] : res.replaced ? [res.replaced] : [];
  sync(res.moved, new Map([res.born]), gone);
  if (info.dir) {
    const parent = nodes.get(before[info.from].id);
    if (parent) jolt(parent.querySelector('.body'), info.dir === 'left' || info.dir === 'right' ? 'sq-x' : 'sq-y');
    sfx.divide();
    buzz(8);
  }
  if (info.mutated) nodes.get(res.born[0])?.classList.add('mutated');
  if (res.pushed) sfx.push();
  if (gone.length) { pop(gone); fx.burst(bornAt, COLORS[gone[0].color][0], 9); sfx.replace(); }
  if (res.removed.length) {
    await wait(220);
    pop(res.removed);
    const poisoned = res.removed.filter(c => level.toxic[slotOf(res.moved, c)]);
    const cleared = res.removed.filter(c => !poisoned.includes(c));
    for (const c of poisoned) fx.smoke(slotOf(res.moved, c));
    if (poisoned.length) sfx.toxic();
    for (const c of cleared) { const i = slotOf(res.moved, c); fx.burst(i, COLORS[c.color][0]); fx.ring(i, COLORS[c.color][0]); }
    if (cleared.length) {
      sfx.clear(cleared.length);
      jolt(stage, 'shake');
      buzz(25);
      fx.text(slotOf(res.moved, cleared[1] || cleared[0]), cleared.length > 3 ? `Khử ${cleared.length}!` : 'Khử 3!', '#ffe27a');
    }
    await wait(330);
  }
  sync(res.cleared);
  if (res.spread.length) {
    await wait(res.removed.length ? 80 : 240);
    pop(res.eaten);
    sync(res.infected, new Map(res.spread), res.eaten);
    for (const c of res.eaten) fx.splat(slotOf(res.cleared, c));
    res.eaten.length ? sfx.eat() : sfx.push();
    await wait(340);
  }
  if (res.poisoned.length) {
    pop(res.poisoned);
    for (const c of res.poisoned) fx.smoke(slotOf(res.infected, c));
    sfx.toxic();
    await wait(330);
  }
  busy = false;
  const woke = res.cells.map((c, i) => c && !c.sleep && res.infected[i] && res.infected[i].sleep ? i : -1).filter(i => i >= 0);
  sync(cells);
  if (woke.length) { for (const i of woke) fx.sparkle(i, '#fff6b0', 10); sfx.wake(); }
  if (isLost(level, cells)) {
    setHearts(save.hearts - 1);
    renderHearts(save.hearts);
  }
  update();
}

function play(from, dir) {
  if (busy || solved || lost || mode || outOfHearts()) return;
  const res = swipe(level, cells, from, dir, nextId);
  if (!res) { refuse(from, 'Không có gì thay đổi'); return; }
  commit(res, null, { from, dir });
}

// Chạm vào thứ không vuốt được: tế bào lắc đầu, kêu "bụp"
function refuse(i, msg) {
  const g = cells[i] && nodes.get(cells[i].id);
  if (g) jolt(g, 'nope');
  sfx.nope();
  toast(msg);
}

function restore(state) {
  cells = state;
  if (mode) { mode = null; toast('', 0); }
  overlay.innerHTML = '';
  sync(cells);
  ringsOk = new Set(level.target.map((t, k) => t && cells[k] && cells[k].color === t ? k : -1).filter(k => k >= 0));
  update();
}

// ---------------------------------------------------------------------------
// Booster: Đột biến và Cấy ghép chọn trên bàn; Hồi sinh chỉ dùng được khi vừa thua
// ---------------------------------------------------------------------------
function modeHint() {
  if (mode.kind === 'mutate') return mode.cell == null ? '🧬 Chạm tế bào muốn đổi màu' : '🧬 Chọn màu mới cho tế bào';
  return mode.from == null ? '💉 Chọn tế bào mẹ' : '💉 Chạm một ô trống bất kỳ để cấy bản sao vào';
}

function setMode(m) {
  mode = m;
  drawMode();
  update();
}

function drawMode() {
  overlay.innerHTML = '';
  if (!mode) { toast('', 0); return; }
  const mark = (i, cls = 'mark') => { const [x, y] = pos(i); return `<circle class="${cls}" cx="${x + SZ / 2}" cy="${y + SZ / 2}" r="42"/>`; };
  let out = '';
  if (mode.kind === 'mutate' && mode.cell != null) {
    // Bảng chọn màu đè lên chính tế bào đã chọn
    const [x, y] = pos(mode.cell);
    const others = level.colors.filter(col => col !== cells[mode.cell].color);
    out += `<rect x="${x + 2}" y="${y + 2}" width="${SZ - 4}" height="${SZ - 4}" rx="22" fill="#2a0f3a" opacity=".82"/>`;
    others.forEach((col, k) => {
      const cx = x + (k - (others.length - 1) / 2) * 42;
      out += `<g class="pick" data-pick="${col}" transform="translate(${cx + SZ * .22} ${y + SZ * .22}) scale(.56)">${cellBody({ color: col, id: 1 })}</g>`;
    });
  } else if (mode.kind === 'clone' && mode.from != null) {
    out += mark(mode.from, 'mark sel');
    level.slot.forEach((s, i) => { if (s && !level.toxic[i] && !cells[i]) out += mark(i); });
  } else {
    cells.forEach((c, i) => { if (c && c.color !== 'V') out += mark(i); });
  }
  overlay.innerHTML = out;
  toast(modeHint(), 0);
}

// Dùng booster: nút nảy, hiệu ứng riêng cho từng loại rồi mới áp nước đi.
async function useBooster(kind, res, info = {}) {
  if (!res) return;
  save.boosters[kind]--;
  persist();
  mode = null;
  toast('', 0);
  overlay.innerHTML = '';
  jolt($('b-' + kind), 'fire');
  sfx.booster();
  buzz(15);
  if (kind === 'mutate') fx.rainbow(info.at);
  if (kind === 'clone') { busy = true; fx.trail(info.from, info.at, COLORS[cells[info.from].color][0]); await wait(300); }
  commit(res, kind, info);
}

function onModeTap(ev) {
  const pick = ev.target.closest('[data-pick]');
  const i = slotAt(toBoard(ev));
  if (i >= 0 && cells[i] && cells[i].color === 'V') { refuse(i, 'Booster không dùng được lên virus'); return; }
  if (mode.kind === 'mutate') {
    if (pick) {
      const at = mode.cell;
      useBooster('mutate', mutate(level, cells, at, pick.dataset.pick, nextId), { at, gone: cells[at], mutated: true });
      return;
    }
    if (i < 0 || !cells[i]) return;
    const col = cells[i].color;
    if (level.colors.includes(col) && cells.filter(c => c && c.color === col).length === 1) { refuse(i, `Không thể đổi tế bào ${NAMES[col]} cuối cùng`); return; }
    const others = level.colors.filter(o => o !== col);
    if (!others.length) { refuse(i, 'Không có màu khác để đổi'); return; }
    sfx.tap();
    if (others.length === 1) { useBooster('mutate', mutate(level, cells, i, others[0], nextId), { at: i, gone: cells[i], mutated: true }); return; }
    mode.cell = i;
    drawMode();
    return;
  }
  if (i >= 0 && cells[i]) { sfx.tap(); mode.from = i; drawMode(); return; }
  if (mode.from == null || i < 0 || !level.slot[i]) return;
  if (level.toxic[i]) { sfx.nope(); toast('Không cấy vào ô độc được'); return; }
  useBooster('clone', transplant(level, cells, mode.from, i, nextId), { from: mode.from, at: i });
}

function revive() {
  if (!lost || busy) return;
  if (!save.boosters.revive) { sfx.nope(); toast('Hết Hồi sinh: bấm "Nạp lại tim và booster" ở dưới cùng'); return; }
  const h = history.pop();
  save.boosters.revive--;
  if (h.spent) save.boosters[h.spent]++;
  setHearts(save.hearts + 1);
  renderHearts(save.hearts - 1, 'gain');
  restore(h.cells);
  jolt($('b-revive'), 'fire');
  jolt(stage, 'flash');
  fx.glow();
  sfx.revive();
  buzz([15, 30, 15]);
  toast('✨ Hồi sinh: đã quay lại trước nước thua và trả lại tim');
}

// ---------------------------------------------------------------------------
// Thẻ hướng dẫn và chọn level
// ---------------------------------------------------------------------------
let learnQueue = [], learnPos = 0, learnFresh = false;

function showLearn(list, fresh) {
  learnQueue = list;
  learnPos = 0;
  learnFresh = fresh;
  renderLearn();
  $('learn').classList.add('show');
}

function renderLearn() {
  const m = learnQueue[learnPos];
  $('learnTag').textContent = !learnFresh ? 'Luật chơi' : m.fresh ? 'Cơ chế mới' : 'Cách chơi';
  $('learnTag').classList.toggle('plain', !learnFresh || !m.fresh);
  $('learnStep').textContent = learnQueue.length > 1 ? `${learnPos + 1}/${learnQueue.length}` : '';
  $('learnTitle').textContent = `${m.icon} ${m.title}`;
  $('learnDemo').innerHTML = m.demos.map(d => {
    const lv = parseLevel(d.def);
    const res = swipe(lv, lv.init, d.from, d.dir);
    return `<div class="demo">${boardSvg(lv, lv.init, d.from, d.dir)}<b>➜</b>${boardSvg(lv, res.cells)}</div>` +
      (d.cap ? `<p class="demo-cap">${d.cap}</p>` : '');
  }).join('');
  $('learnPoints').innerHTML = m.points.map(p => `<li>${p}</li>`).join('');
  $('learnOk').textContent = learnPos < learnQueue.length - 1 ? 'Tiếp ›' : learnFresh ? 'Đã hiểu, chơi thôi!' : 'Đóng';
  // Thẻ mới lật ra thì nảy lên lại
  jolt($('learn').querySelector('.card'), 'card');
}

$('learnOk').onclick = () => {
  const m = learnQueue[learnPos];
  sfx.tap();
  if (!save.seen.includes(m.key)) { save.seen.push(m.key); persist(); }
  if (++learnPos < learnQueue.length) renderLearn();
  else $('learn').classList.remove('show');
};
$('rules').onclick = () => { sfx.tap(); showLearn(MECHANICS.filter(m => m.has(level, index)), false); };

// ---------------------------------------------------------------------------
// Màn tổng quan: tiến độ chung, nút chơi tiếp, các chương với con đường qua từng level
// ---------------------------------------------------------------------------
function showHome() {
  screen = 'home';
  mode = null;
  gesture = null;
  $('app').hidden = true;
  $('home').hidden = false;
  for (const id of ['solved', 'lost', 'learn', 'nohearts']) $(id).classList.remove('show');
  fx.clear();
  renderHome();
  renderHearts();
  renderClock();
  const focus = document.querySelector('.node.fresh') || document.querySelector('.node.cur');
  if (focus) focus.scrollIntoView({ block: 'center' });
  freshWin = -1;
}

function enterLevel(i) {
  screen = 'game';
  $('home').hidden = true;
  $('app').hidden = false;
  window.scrollTo(0, 0);
  load(i);
}

function renderHome() {
  const n = LEVELS.length, done = LEVELS.filter((_, i) => isDone(i)).length;
  const stars = LEVELS.reduce((s, _, i) => s + starsOf(i), 0), nx = nextLevel();
  $('homeStars').textContent = `⭐ ${stars}/${n * 3}`;
  $('overallText').textContent = `Đã qua ${done}/${n} level`;
  $('overallStars').textContent = `${Math.round(done / n * 100)}%`;
  $('overallBar').style.width = `${done / n * 100}%`;
  $('playNext').innerHTML = nx < 0 ? '🏆 Đã qua hết!<small>Chơi lại để gom đủ 3 sao</small>'
    : `▶ ${done ? 'Chơi tiếp' : 'Bắt đầu'}<small>Level ${nx + 1} · ${CHAPTERS.find(c => nx >= c.from && nx <= c.to).name}</small>`;
  $('chapters').innerHTML = CHAPTERS.map((ch, k) => chapterHtml(ch, k, nx)).join('');
  $('unlockAll').textContent = save.unlockAll ? 'Khoá lại theo thứ tự (bản thử)' : 'Mở khoá tất cả level (bản thử)';
}

// Các level của một chương xếp kiểu rắn bò, 4 nút một hàng: hàng chẵn trái sang phải, hàng lẻ ngược lại.
// Con đường mờ nối mọi nút; đoạn chấm vàng là quãng đã đi tới.
function chapterHtml(ch, k, nx) {
  const ids = [];
  for (let i = ch.from; i <= ch.to; i++) ids.push(i);
  const doneN = ids.filter(isDone).length, stars = ids.reduce((s, i) => s + starsOf(i), 0);
  const rows = Math.ceil(ids.length / 4);
  const cellOf = j => { const r = Math.floor(j / 4); return [r, r % 2 ? 3 - j % 4 : j % 4]; };
  const pts = ids.map((_, j) => { const [r, c] = cellOf(j); return `${c * 100 + 50},${r * 100 + 50}`; });
  const reached = ids.reduce((far, i, j) => isDone(i) || i === nx ? j + 1 : far, 0);
  const nodes = ids.map((i, j) => {
    const [r, c] = cellOf(j);
    const state = isDone(i) ? 'done' : !unlocked(i) ? 'lock' : i === nx ? 'cur' : '';
    const badge = newIcons(i);
    return `<button class="node ${state}${i === freshWin ? ' fresh' : ''}" data-level="${i}" style="grid-row:${r + 1};grid-column:${c + 1}" aria-label="Level ${i + 1}">` +
      (state === 'lock' ? '🔒' : i + 1) +
      (isDone(i) ? `<span class="stars">${starRow(starsOf(i))}</span>` : '') +
      (badge ? `<span class="new">${badge}</span>` : '') +
      (state === 'cur' ? `<svg class="marker" viewBox="-6 -10 102 108">${cellBody({ color: 'A', id: 3 })}</svg>` : '') + '</button>';
  }).join('');
  return `<section class="chapter${unlocked(ch.from) ? '' : ' locked'}">
    <div class="chhead"><span class="ic">${ch.icon}</span><div><small>Chương ${k + 1}</small><h3>${ch.name}</h3><small>${ch.note}</small></div>
      <div class="prog">${doneN}/${ids.length}<small>⭐ ${stars}/${ids.length * 3}</small></div></div>
    <div class="meter"><i style="width:${doneN / ids.length * 100}%"></i></div>
    <div class="path" style="grid-template-rows:repeat(${rows}, 112px)">
      <svg class="roads" viewBox="0 0 400 ${rows * 100}" preserveAspectRatio="none"><polyline class="road" points="${pts.join(' ')}"/>` +
      (reached > 1 ? `<polyline class="road walked" points="${pts.slice(0, reached).join(' ')}"/>` : '') + `</svg>
      ${nodes}</div></section>`;
}

// Thẻ chi tiết level: ảnh thu nhỏ của bàn, mục tiêu, cơ chế, kỷ lục và mốc 3 sao.
function openSheet(i) {
  const lv = parseLevel(LEVELS[i]), k = CHAPTERS.findIndex(c => i >= c.from && i <= c.to), d = save.done[i], par = parOf(i);
  $('shChapter').textContent = `Chương ${k + 1} · ${CHAPTERS[k].name}`;
  $('shTitle').textContent = `Level ${i + 1}`;
  $('shPreview').innerHTML = boardSvg(lv, lv.init);
  $('shGoal').textContent = goalOf(lv);
  $('shMechs').innerHTML = MECHANICS.filter(m => (m.fresh || m.key === 'target') && m.has(lv, i)).map(m => `<span>${m.icon} ${m.title}</span>`).join('')
    || '<span>👆 Chia · đẩy · thay thế · khử 3</span>';
  $('shRecord').innerHTML = d ? `<span class="stars">${starRow(d.stars)}</span><span>Kỷ lục ${d.best} lần vuốt · 3⭐ khi ≤ ${par}</span>`
    : `<span>Chưa qua · xong trong ${par} lần vuốt để được 3⭐</span>`;
  const open = unlocked(i);
  $('shPlay').disabled = !open;
  $('shPlay').textContent = !open ? `🔒 Qua level ${i} để mở` : d ? 'Chơi lại ▶' : 'Chơi ▶';
  $('shPlay').onclick = () => { sfx.tap(); $('sheet').classList.remove('show'); enterLevel(i); };
  $('sheet').classList.add('show');
}

$('chapters').onclick = ev => {
  const b = ev.target.closest('[data-level]');
  if (!b) return;
  sfx.tap();
  openSheet(+b.dataset.level);
};
$('shClose').onclick = () => $('sheet').classList.remove('show');
$('playNext').onclick = () => {
  sfx.tap();
  const nx = nextLevel();
  enterLevel(nx >= 0 ? nx : Math.max(0, LEVELS.findIndex((_, i) => starsOf(i) < 3)));
};
$('unlockAll').onclick = () => { save.unlockAll = !save.unlockAll; persist(); sfx.tap(); renderHome(); };
$('wipe').onclick = () => {
  if (!confirm('Xoá toàn bộ sao, tiến độ và hướng dẫn đã xem?')) return;
  save.done = {};
  save.seen = [];
  persist();
  renderHome();
};

// ---------------------------------------------------------------------------
// Thao tác: nhấn vào tế bào rồi vuốt; mắt tế bào nhìn theo và mũi tên xem trước hướng sẽ chia
// ---------------------------------------------------------------------------
function toBoard(ev) {
  const p = board.createSVGPoint();
  p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform(board.getScreenCTM().inverse());
}

function slotAt(pt) {
  const c = Math.floor(pt.x / SZ), r = Math.floor(pt.y / SZ);
  return r < 0 || c < 0 || r >= level.h || c >= level.w ? -1 : r * level.w + c;
}

function dirOf(dx, dy) {
  if (Math.hypot(dx, dy) < SZ * 0.3) return null;
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}

function drawArrow(from, dir) {
  overlay.innerHTML = dir ? arrowSvg(level, from, dir) : '';
}

function lookAt(i, dir) {
  const look = cells[i] && nodes.get(cells[i].id)?.querySelector('.look');
  if (look) look.style.transform = dir ? `translate(${LOOK[dir][0] * 3}px, ${LOOK[dir][1] * 3}px)` : '';
}

board.addEventListener('pointerdown', ev => {
  if (busy || solved || lost || outOfHearts()) return;
  if (mode) { onModeTap(ev); return; }
  const pt = toBoard(ev);
  const i = slotAt(pt);
  if (i < 0 || !cells[i]) return;
  if (cells[i].color === 'V') { refuse(i, 'Virus không vuốt được'); return; }
  if (cells[i].sleep) { refuse(i, 'Tế bào đang ngủ: cần một tế bào cùng màu đứng cạnh để đánh thức'); return; }
  sfx.tap();
  gesture = { from: i, x: pt.x, y: pt.y, dir: null };
  try { board.setPointerCapture(ev.pointerId); } catch (e) { /* con trỏ đã nhả trước khi bắt */ }
});

board.addEventListener('pointermove', ev => {
  if (!gesture) return;
  const pt = toBoard(ev);
  const dir = dirOf(pt.x - gesture.x, pt.y - gesture.y);
  if (dir !== gesture.dir) { gesture.dir = dir; drawArrow(gesture.from, dir); lookAt(gesture.from, dir); }
});

board.addEventListener('pointerup', () => {
  if (!gesture) return;
  const { from, dir } = gesture;
  gesture = null;
  overlay.innerHTML = '';
  lookAt(from, null);
  if (dir) play(from, dir);
});
board.addEventListener('pointercancel', () => { if (gesture) lookAt(gesture.from, null); gesture = null; overlay.innerHTML = ''; });

let toastTimer;
// ms = 0 giữ thông báo tới khi bị thay; hết giờ thì quay về hướng dẫn của booster đang chọn (nếu có).
function toast(msg, ms = 2400) {
  $('toast').textContent = msg;
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => { $('toast').textContent = mode ? modeHint() : ''; }, ms);
}

$('undo').onclick = () => {
  if (busy || lost || !history.length) return;
  sfx.tap();
  const h = history.pop();
  restore(h.cells);
  if (h.spent) {
    save.boosters[h.spent]++;
    persist();
    update();
    toast(`Đã trả lại booster ${BOOSTER_NAMES[h.spent]}`);
  }
};
$('reset').onclick = $('lostReset').onclick = () => {
  if (busy) return;
  sfx.tap();
  if (lost) { load(index); return; }          // sau khi thua thì chơi lại từ đầu, không hoàn tác về ván thua
  if (keyOf(cells) === keyOf(level.init)) return;
  history.push({ cells, spent: null, reset: true });
  restore(level.init.slice());
};
$('hint').onclick = () => {
  if (busy || solved || lost) return;
  if (mode) setMode(null);
  const path = solve(level, cells);
  if (!path) { sfx.nope(); toast('Từ đây không thắng được nữa, hãy hoàn tác.'); return; }
  sfx.ding();
  drawArrow(path[0][0], path[0][1]);
  lookAt(path[0][0], path[0][1]);
  toast(`💡 Thử vuốt theo mũi tên · còn ít nhất ${path.length} lần vuốt`);
  setTimeout(() => { if (!gesture && !mode) { overlay.innerHTML = ''; lookAt(path[0][0], null); } }, 2500);
};
for (const kind of ['mutate', 'clone']) $('b-' + kind).onclick = () => {
  if (mode && mode.kind === kind) { sfx.tap(); setMode(null); return; }
  if (busy || solved || lost) return;
  if (!save.boosters[kind]) { sfx.nope(); toast('Hết booster: bấm "Nạp lại tim và booster" ở dưới cùng'); return; }
  sfx.tap();
  jolt($('b-' + kind), 'fire');
  setMode({ kind });
};
$('b-revive').onclick = $('lostRevive').onclick = revive;
$('refill').onclick = () => { setHearts(MAX_HEARTS); renderHearts(); update(); sfx.revive(); };
$('refillAll').onclick = () => {
  save.boosters = { ...START_BOOSTERS };
  setHearts(MAX_HEARTS);
  renderHearts();
  update();
  sfx.booster();
  toast('Đã nạp lại 3 tim và booster');
};
const renderMute = () => { $('mute').textContent = $('homeMute').textContent = save.muted ? '🔇' : '🔊'; };
$('mute').onclick = $('homeMute').onclick = () => { save.muted = !save.muted; persist(); renderMute(); sfx.tap(); };
$('toHome').onclick = $('title').onclick = $('toMap').onclick = () => { sfx.tap(); showHome(); };
$('next').onclick = () => { if (index < LEVELS.length - 1 && unlocked(index + 1)) { sfx.tap(); load(index + 1); } };
$('continue').onclick = () => {
  sfx.tap();
  if (index < LEVELS.length - 1 && unlocked(index + 1)) load(index + 1);
  else showHome();
};

renderMute();
regen();
setInterval(() => { if (regen()) { renderHearts(); if (screen === 'game') update(); } else renderClock(); }, 1000);
showHome();
</script>
</body>
</html>
